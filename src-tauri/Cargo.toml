[package]
name = "pmgr-gui"
version = "0.1.0"
description = "密码管理器（Tauri GUI）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
zeroize = { version = "1", features = ["derive"] }
pmgr-core = { path = "../core" }
